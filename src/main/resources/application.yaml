spring:
  application:
    name: storm-imdb-graalvm
  autoconfigure:
    # This application uses Storm's coroutine-native suspend transaction { }
    # blocks exclusively. Suspend mode is incompatible with Spring-managed
    # Storm transactions, so the Spring transaction integration is disabled;
    # Storm manages transactions directly on the DataSource.
    exclude:
      - st.orm.spring.boot.StormTransactionAutoConfiguration
  datasource:
    # Note: reWriteBatchedInserts is intentionally NOT enabled — it breaks
    # the per-row affected counts that Storm verifies after batch writes.
    # prepareThreshold=0 keeps every statement unnamed, so PostgreSQL plans each
    # execution for its parameter values. A named statement switches to a generic
    # plan after five executions, and a generic plan cannot see a search word: for
    # the name suggestions it walks the name index in order, lowering every name
    # until four match, instead of reading the few matches from the trigram index.
    url: jdbc:postgresql://localhost:5432/imdb?prepareThreshold=0
    username: storm
    password: storm
  threads:
    virtual:
      enabled: true

imdb:
  import:
    cache-directory: ./data
    minimum-vote-count: 1000
  gallery-refresh:
    # Galleries older than max-age are re-fetched from Wikimedia by the scheduled
    # refresh, which reads them in keyset windows: one statement per window, the
    # connection free in between (PersonGalleryService.refreshStaleGalleries).
    max-age: 30d
    interval: 6h
    initial-delay: 1h

# Storm reports every query (storm.query) and every transaction (storm.transaction) as
# Micrometer Observations once an ObservationRegistry is present; Actuator provides one.
# Inspect the timers at /actuator/metrics/storm.query and /actuator/metrics/storm.transaction.
management:
  endpoints:
    web:
      exposure:
        # The storm endpoint is Storm's control surface on the running application:
        # GET /actuator/storm reads the SQL log settings below, POST retunes them
        # without a restart.
        include: health,metrics,storm

# Query observations report the OpenTelemetry database semantic conventions, so the
# spans surface in the database views of OTLP-capable backends. The trace context also
# rides along as a sqlcommenter-style comment on every statement (opt-in: a per-execution
# comment defeats prepared statement caching), correlating PostgreSQL's own diagnostics
# (pg_stat_activity, slow logs) back to the trace.
storm:
  observations:
    semantic-conventions: otel
  tracing:
    sql-comments: true
  # What the database cost is reported two ways. The performance log summarises each
  # request that exceeds a threshold (statements, database time against total time, and
  # the statement that carried the weight) under st.orm.sql.perf; the slow log reports a
  # single execution that exceeds its threshold under st.orm.sql.slow, with its call site
  # and how it compares to what its shape typically costs. Both thresholds are production
  # grade, so the logs stay quiet until something is wrong; lower them at runtime through
  # the storm actuator endpoint.
  sql-log:
    performance:
      enabled: true
      threshold:
        statements: 50
        duration: 500ms
    slow:
      threshold: 200ms
